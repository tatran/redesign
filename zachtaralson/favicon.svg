<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Zach Taralson · Sploosh! Studios &amp; Enevold">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#190813" />
      <stop offset="55%" stop-color="#3a102b" />
      <stop offset="100%" stop-color="#571d44" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#bg)" />
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.65" />
  <!-- Waveform bars -->
  <g fill="url(#accent)">
    <rect x="12" y="26" width="3.5" height="12" rx="1.75" />
    <rect x="18" y="20" width="3.5" height="24" rx="1.75" />
    <rect x="24" y="13" width="3.5" height="38" rx="1.75" />
    <rect x="30" y="22" width="3.5" height="20" rx="1.75" />
    <rect x="36" y="16" width="3.5" height="32" rx="1.75" />
    <rect x="42" y="23" width="3.5" height="18" rx="1.75" />
    <rect x="48" y="27" width="3.5" height="10" rx="1.75" />
  </g>
  <!-- Subtle ZT / Enevold ring -->
  <circle cx="32" cy="32" r="24" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="4 4" opacity="0.22" />
</svg>
