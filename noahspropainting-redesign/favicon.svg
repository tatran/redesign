<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="nppGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background Shield / Badge -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#nppGrad)" />
  
  <!-- Stylized Roller Head & Handle -->
  <!-- Paint Roller Cylinder -->
  <rect x="16" y="14" width="28" height="12" rx="4" fill="#ffffff" filter="url(#glow)"/>
  <rect x="18" y="16" width="6" height="8" rx="2" fill="url(#goldAccent)"/>
  <rect x="27" y="16" width="6" height="8" rx="2" fill="url(#goldAccent)"/>
  <rect x="36" y="16" width="6" height="8" rx="2" fill="url(#goldAccent)"/>
  
  <!-- Roller Wire & Frame -->
  <path d="M 44 20 L 48 20 C 50 20 51 22 51 24 L 51 32 C 51 34 50 35 48 35 L 34 35 L 34 42" 
        fill="none" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
        
  <!-- Handle Grip -->
  <rect x="31" y="42" width="6" height="12" rx="2" fill="url(#goldAccent)" stroke="#ffffff" stroke-width="1.5" />
  
  <!-- Precision Paint Swash / Drop -->
  <path d="M 17 32 C 17 38 23 44 23 44 C 23 44 29 38 29 32 C 29 28 26.5 26 23 26 C 19.5 26 17 28 17 32 Z" fill="#38bdf8" />
  <circle cx="21" cy="31" r="1.5" fill="#ffffff" opacity="0.8"/>
</svg>
